<!doctype html>
<html lang="en">
    <head>
        <!-- Read file as utf-8, unicode encoding of every character -->
        <meta charset="utf-8" />

        <!-- Use viewport which the phone browser reports us and not the fixed 980;
             the keyboard of a phone makes the page smaller instead of covering it,
             so a dialog and the menu of a list stay above it while I type -->
        <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content" />

        <!-- Name of page, shown in browser tab -->
        <title>NomSystem</title>

        <!-- Logo, shown in browser tab; file in assets, given out as it is -->
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />

        <!-- Name, colours and logos with which the phone installs the page
             as an app on its home screen -->
        <link rel="manifest" href="/manifest.webmanifest" />

        <!-- Colour of the phone's status bar above the page,
             same as the page background -->
        <meta name="theme-color" content="#1e1e1e" />

        <!-- Colours, sizes and look of the whole page, read before the page first shows,
             so switching areas never flashes a white, unstyled page -->
        <link rel="stylesheet" href="/src/variants.css" />
        <link rel="stylesheet" href="/src/base.css" />

        <!-- Type module allows import in the ts file, source main.ts in src -->
        <script type="module" src="/src/main.ts"></script>
    </head>

    <body>

             written here, so it shows at once and no word flashes before it,
             its name as tooltip: a calendar for the day of NomManagecalendar,

             an open book for the scripts of NomSkillingmodules,
             an open folder for NomManageplannings,
             below it each folder of it with a button of its own, showing its files alone,
             a brain for NomFrequenceintelligence, a sheet for NomMetainformations,
             a cap for NomModulesuniversity, a flask for NomStudysciences,
             fork and knife for the food of NomLivingfoods, a dumbbell for the sport of NomHealthsports;
             main.ts marks the shown one and opens it -->
